<div class="page-header">
  <div class="page-subtitle">Editar dados de contato</div>
  <a href="#" class="btn btn-secondary" hx-get="/mapas/{{ mapa_id }}/tabs/fornecedores" hx-target="#tab-content" hx-swap="innerHTML">Voltar</a>
</div>
<form class="inline-form" hx-post="/mapas/{{ mapa_id }}/fornecedores/{{ fornecedor.id }}/editar" hx-target="#tab-content" hx-swap="innerHTML">
  <div class="form-grid">
    <div class="field"><label>Nome</label><input name="nome" required value="{{ fornecedor.nome }}"></div>
    <div class="field"><label>Contato</label><input name="contato" value="{{ fornecedor.contato or '' }}"></div>
    <div class="field"><label>Telefone</label><input name="telefone" value="{{ fornecedor.telefone or '' }}"></div>
    <div class="field"><label>E-mail</label><input name="email" type="email" value="{{ fornecedor.email or '' }}"></div>
    <div class="field"><label>Endereço</label><input name="endereco" value="{{ fornecedor.endereco or '' }}"></div>
    <div class="field"><label>Cidade</label><input name="cidade" value="{{ fornecedor.cidade or '' }}"></div>
    <div class="field"><label>CNPJ</label><input name="cnpj" value="{{ fornecedor.cnpj or '' }}"></div>
    <div class="field"><label>Inscrição Estadual</label><input name="inscricao_estadual" value="{{ fornecedor.inscricao_estadual or '' }}"></div>
    <div class="field"><label>Sócio</label><input name="socio" value="{{ fornecedor.socio or '' }}"></div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Salvar</button>
  </div>
</form>
